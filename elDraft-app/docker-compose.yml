services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: eldraft-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eldraft
      POSTGRES_USER: eldraft
      POSTGRES_PASSWORD: eldraft
    ports:
      - "5432:5432"
    volumes:
      - eldraft-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eldraft -d eldraft"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  eldraft-pgdata:
