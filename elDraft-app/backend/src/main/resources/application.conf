ktor {
    # Modo desarrollo. En false (producción) el arranque ABORTA si hay secretos por
    # defecto o auth en modo mock; en true solo se avisa. El task :backend:run lo
    # activa automáticamente, así que el trabajo local no se ve afectado.
    development = false
    development = ${?KTOR_DEVELOPMENT}

    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.eldraft.backend.ApplicationKt.module ]
    }
}

cors {
    # Orígenes permitidos para clientes de navegador, separados por coma.
    # Vacío = ninguno: la app Android es nativa y no necesita CORS.
    # Ej: CORS_ALLOWED_HOSTS=admin.eldraft.app,http://localhost:3000
    allowedHosts = ""
    allowedHosts = ${?CORS_ALLOWED_HOSTS}
}

database {
    url = "jdbc:postgresql://localhost:5432/eldraft"
    url = ${?DATABASE_URL}
    user = "eldraft"
    user = ${?DATABASE_USER}
    password = "eldraft"
    password = ${?DATABASE_PASSWORD}
    maxPoolSize = 10

    # Reset destructivo al arrancar: borra ratings, asistencias, postulaciones y
    # convocatorias. SOLO desarrollo. Por defecto apagado — con esto en true, cada
    # restart de producción sería un reset de fábrica.
    resetOnStart = false
    resetOnStart = ${?DATABASE_RESET_ON_START}
}

jwt {
    secret = "change-me-in-production"
    secret = ${?JWT_SECRET}
    issuer = "eldraft"
    audience = "eldraft-users"
    realm = "elDraft App"
}

notifications {
    # Radio (en km) para notificar a jugadores cercanos cuando se crea una
    # convocatoria. Se compara contra la última ubicación conocida del jugador.
    nearbyRadiusKm = 50
    nearbyRadiusKm = ${?NOTIFICATIONS_NEARBY_RADIUS_KM}

    # Recordatorio recurrente: cada cuántos minutos se reenvía el push a los
    # jugadores cercanos de convocatorias activas que aún NO tienen postulantes.
    # Deja de recordar en cuanto alguien se postula (o la convocatoria vence).
    # Poner 0 (o negativo) DESHABILITA el recordatorio.
    reminderIntervalMinutes = 30
    reminderIntervalMinutes = ${?NOTIFICATIONS_REMINDER_INTERVAL_MINUTES}
}

firebase {
    projectId = "eldraft-a6d42"
    projectId = ${?FIREBASE_PROJECT_ID}
    # Modo de verificación del token de Firebase:
    #   "mock"     -> NO verifica contra Google; decodifica un token de desarrollo. Solo para dev.
    #   "firebase" -> verifica de verdad con Firebase Admin SDK (requiere service account).
    authMode = "mock"
    authMode = ${?FIREBASE_AUTH_MODE}
    # Service account. Se necesita para authMode="firebase" y para enviar push FCM.
    # Dos vías, se usa la que esté definida (el JSON inline tiene prioridad):
    #
    #   serviceAccountJson -> contenido del JSON, en Base64 o plano. Única opción en
    #     Railway y proveedores que solo exponen variables de entorno.
    #     Generar con: base64 -w0 serviceAccountKey.json
    #
    #   serviceAccountPath -> ruta a un archivo. Dev local (se inyecta desde
    #     local.properties vía el task :backend:run) y proveedores que montan
    #     secretos en el filesystem (Fly.io, Kubernetes).
    serviceAccountJson = ${?FIREBASE_SERVICE_ACCOUNT_JSON}
    serviceAccountPath = ${?FIREBASE_SERVICE_ACCOUNT_PATH}
}
