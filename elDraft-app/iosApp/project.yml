name: iosApp
options:
  bundleIdPrefix: com.eldraft
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.eldraft.ios$(BUNDLE_SUFFIX)
    MARKETING_VERSION: 0.1.0$(VERSION_SUFFIX)
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    # Sin cuenta de pago no hay DEVELOPMENT_TEAM propio: se deja vacío y Xcode
    # firma con la cuenta personal (gratuita) al correr en simulador o
    # dispositivo. El día que exista equipo de pago, se fija aquí.
    DEVELOPMENT_TEAM: ""
    # El framework de shared es estático (isStatic = true en
    # shared/build.gradle.kts): no se "embebe" como un .dylib, se enlaza
    # directo al binario. FRAMEWORK_SEARCH_PATHS apunta adonde
    # embedAndSignAppleFrameworkForXcode deja el .framework para cada
    # configuración/SDK; OTHER_LDFLAGS lo enlaza.
    FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
    OTHER_LDFLAGS: "$(inherited) -framework shared"

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.6.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.1.0

targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iosApp
        # Ya son el INFOPLIST_FILE de cada configuración (ver Config/*.xcconfig);
        # sin este exclude, XcodeGen también los mete en Copy Bundle Resources.
        # GoogleService-Info-*.plist también se excluye: no se referencian por
        # nombre fijo (Firebase exige "GoogleService-Info.plist" exacto), el
        # script "Copiar GoogleService-Info.plist" los renombra al copiarlos.
        excludes:
          - "Info-Debug.plist"
          - "Info-Release.plist"
          - "GoogleService-Info-Debug.plist"
          - "GoogleService-Info-Release.plist"
    # Sin esto XcodeGen no genera un .xcscheme versionado: cada quien que abra
    # el proyecto obtendría un scheme "autocreado" propio (en xcuserdata, sin
    # commitear), lo que rompe xcodebuild -scheme iosApp en una máquina limpia.
    # testTargets deja `xcodebuild test -scheme iosApp` corriendo iosAppUITests
    # sin flags adicionales.
    scheme:
      testTargets:
        - iosAppUITests
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseCore
      - package: GoogleSignIn
        product: GoogleSignIn
    preBuildScripts:
      - name: "Verificar config de Release"
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Release" ]; then
            if [ -z "$MAPS_API_KEY_IOS" ]; then
              echo "error: falta MAPS_API_KEY_IOS en iosApp/Config/Release.xcconfig para compilar Release."
              exit 1
            fi
            if [ -z "$GOOGLE_REVERSED_CLIENT_ID" ] || [ ! -f "$SRCROOT/iosApp/GoogleService-Info-Release.plist" ]; then
              echo "error: falta GoogleService-Info-Release.plist y/o GOOGLE_REVERSED_CLIENT_ID en iosApp/Config/Release.xcconfig para compilar Release."
              exit 1
            fi
          fi
      - name: "Compilar framework de Kotlin (shared)"
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
      - name: "Copiar GoogleService-Info.plist"
        basedOnDependencyAnalysis: false
        script: |
          src="$SRCROOT/iosApp/GoogleService-Info-${CONFIGURATION}.plist"
          if [ -f "$src" ]; then
            mkdir -p "$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
            cp -f "$src" "$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/GoogleService-Info.plist"
          elif [ "$CONFIGURATION" = "Debug" ]; then
            echo "warning: falta $src — registrá la app en Firebase y descargalo ahí (ver Info-Debug.plist / GOOGLE_REVERSED_CLIENT_ID)."
          fi

  # UI tests de extremo a extremo contra el backend local (docker compose +
  # :backend:run — ver "Verificación general" del plan de port). Corre dentro
  # de una app real instalada en el simulador, a diferencia de
  # `:shared:iosSimulatorArm64Test` (binario nativo suelto, sin acceso a
  # Keychain): es la única forma de probar de verdad que la sesión persiste.
  iosAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iosAppUITests
    dependencies:
      - target: iosApp
