name: iosApp
options:
  bundleIdPrefix: com.eldraft
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.eldraft.ios$(BUNDLE_SUFFIX)
    MARKETING_VERSION: 0.1.0$(VERSION_SUFFIX)
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    # Sin cuenta de pago no hay DEVELOPMENT_TEAM propio: se deja vacío y Xcode
    # firma con la cuenta personal (gratuita) al correr en simulador o
    # dispositivo. El día que exista equipo de pago, se fija aquí.
    DEVELOPMENT_TEAM: ""
    # El framework de shared es estático (isStatic = true en
    # shared/build.gradle.kts): no se "embebe" como un .dylib, se enlaza
    # directo al binario. FRAMEWORK_SEARCH_PATHS apunta adonde
    # embedAndSignAppleFrameworkForXcode deja el .framework para cada
    # configuración/SDK; OTHER_LDFLAGS lo enlaza.
    FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
    OTHER_LDFLAGS: "$(inherited) -framework shared"

targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iosApp
        # Ya son el INFOPLIST_FILE de cada configuración (ver Config/*.xcconfig);
        # sin este exclude, XcodeGen también los mete en Copy Bundle Resources.
        excludes:
          - "Info-Debug.plist"
          - "Info-Release.plist"
    # Sin esto XcodeGen no genera un .xcscheme versionado: cada quien que abra
    # el proyecto obtendría un scheme "autocreado" propio (en xcuserdata, sin
    # commitear), lo que rompe xcodebuild -scheme iosApp en una máquina limpia.
    scheme: {}
    preBuildScripts:
      - name: "Verificar config de Release"
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Release" ] && [ -z "$MAPS_API_KEY_IOS" ]; then
            echo "error: falta MAPS_API_KEY_IOS en iosApp/Config/Release.xcconfig para compilar Release."
            exit 1
          fi
      - name: "Compilar framework de Kotlin (shared)"
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
